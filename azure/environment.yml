# The job environment, built rather than borrowed.
#
# An earlier version of this file named a curated Azure ML PyTorch image, on the reasoning
# that building a CUDA image to run CPU-bound work is wasted effort. The reasoning held;
# the image did not. Curated images pin their own Python and their own torch — 3.10 and
# 2.2 here — and this project's reference platform is a Mac mini running 3.12 and 2.14.1.
# Numbers produced under the curated image could not be compared with the ones the mini is
# producing, which is the only reason to run anything on Azure at all.
#
# So the image is built from azure/docker/Dockerfile against uv.lock, and the versions
# inside it are a consequence of that lock rather than of a vendor's release schedule. The
# base carries no CUDA: a PyPI torch wheel for Linux brings its own runtime and needs only
# the host's driver.
$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: nas4av
description: >-
  Python 3.12.8 with torch 2.14.1, built from uv.lock so the environment matches the
  reference platform. The image digest is recorded with every job, so a result can be
  traced to the runtime that produced it.

# The context is the repository root because the lock lives there, narrowed to three files
# by .dockerignore. Pointing it at azure/docker/ instead would mean keeping a second copy
# of pyproject.toml and uv.lock beside the Dockerfile, and a copied lock is a lock that
# drifts.
build:
  path: ..
  dockerfile_path: azure/docker/Dockerfile
