# The canary that gates the fan-out.
#
# One unit on the cheapest setting. Its purpose is not the result -- the mini is producing
# those -- but to demonstrate end to end that the platform works: the image resolves, the
# code uploads, the cache mounts, a spot node schedules the job, the artifact lands in the
# outputs, and the cluster returns to zero.
#
# A failing canary blocks the sweep. That is the rule the sibling project's spec states and
# the reason this runs before anything larger.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
experiment_name: nas4av-canary
display_name: canary-2013-sem-uniform-random

code: ..
environment: azureml:nas4av@latest
compute: azureml:sweep-spot

inputs:
  cache:
    type: uri_folder
    mode: ro_mount
    path: azureml://datastores/cache/paths/

outputs:
  results:
    type: uri_folder
    mode: rw_mount

# A wall-clock limit, because an idle window cannot catch a hung job: it holds its node
# and bills until somebody notices. Twenty minutes is generous for a 120-evaluation unit
# on the cheapest setting, and short enough that a hang is cheap.
limits:
  timeout: 1200

# NAS4AV_ARTIFACTS and NAS4AV_REFERENCE are deliberately absent here and set in the command
# instead. Azure ML expands `${{inputs.x}}` and `${{outputs.x}}` inside `command` and not
# inside `environment_variables`, so declaring them here hands the process the literal nine
# characters `${{inputs.cache}}` as a path. Nothing warns: the job starts, the mount is
# fine, and it fails much later on a FileNotFoundError whose path has the unexpanded
# placeholder sitting in the middle of it.
environment_variables:
  PYTHONWARNINGS: ignore
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

# `uv pip` rather than `pip`, which is not a style preference. The image's environment is
# built by `uv sync`, and a uv-created environment has no pip in it — so a bare `pip` falls
# through to the base image's conda installation and installs the project somewhere the
# job's interpreter never looks. That failure is quiet in the worst way: pip reports
# success, and the job dies afterwards on `No module named 'nas4av'` as though the code had
# not been uploaded.
#
# `--no-deps` is load-bearing. The image is built from uv.lock and is meant to be sealed: a
# job supplies code, never dependencies. Without the flag the installer is free to resolve
# something the lock does not mention, and the job would run on an environment that no
# longer matches the reference platform while still reporting the image it started from.
#
# The platform line is printed before the sweep rather than after, so a mismatch is visible
# in the log of a job that then fails for some other reason. It also answers a question
# this configuration deliberately does not assert anywhere else: a PyPI torch wheel bundles
# its own CUDA runtime, and which compute capabilities it was built for is a fact about the
# wheel rather than about this file.
command: >-
  export NAS4AV_REFERENCE=${{inputs.cache}} NAS4AV_ARTIFACTS=${{outputs.results}} &&
  uv pip install --quiet --no-deps -e . &&
  python -u -c "import sys, torch; print('platform:', sys.version.split()[0], 'torch', torch.__version__, '| cuda', torch.cuda.is_available(), '| arch', torch.cuda.get_arch_list() if torch.cuda.is_available() else 'n/a')" &&
  (nvidia-smi --query-gpu=name,driver_version --format=csv,noheader || echo "no nvidia-smi") &&
  python -u -m nas4av.cli sweep
  --settings 2013/sem
  --strategies uniform-random
  --runs 1
  --budget 120
